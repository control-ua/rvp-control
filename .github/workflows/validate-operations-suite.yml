name: Validate Operations Suite
on:
  push:
    branches: ["feature/operations-suite"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: |
            typecheck.log
            build.log
      - name: Fail if validation failed
        if: steps.typecheck.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
